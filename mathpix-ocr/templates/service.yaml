apiVersion: v1
kind: Service
metadata:
  name: mathpix-ocr-loadbalancer
  namespace: {{ include "mathpix-ocr.fullname" . }}-mathpix-ocr
spec:
  selector:
    app: {{ include "mathpix-ocr.fullname" . }}-ocr-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8070
  type: LoadBalancer
