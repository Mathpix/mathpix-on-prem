{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
  template:
    metadata:
      labels:
        app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
    spec:
      containers:
        - name: {{ $name | lower }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.service.port }}
          envFrom:
            - configMapRef:
                name: mathpix-env
          env:
{{ toYaml $svc.env | indent 12 }}
          resources:
            {{- if eq $name "ocr-worker" }}
            limits:
              nvidia.com/gpu: "1"
            {{- end }}
{{- $merged := merge $.Values.global.resources $svc.resources }}
{{ toYaml $merged | indent 12 }}
---
{{- end }}
{{- end }}
