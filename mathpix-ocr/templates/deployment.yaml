{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{ include "mathpix-ocr.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
  template:
    metadata:
      labels:
        app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: {{ $name | lower }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.service.port }}
          {{- with $svc.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
{{ toYaml . | indent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mathpix-ocr.fullname" $ }}-mathpix-env
          {{- if gt (len $svc.env) 0 }}
          env:
          - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_SECRET_ACCESS_KEY
{{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
{{- end }}
          {{- end }}
          resources:
            {{- if eq $name "ocr-worker" }}
            limits:
              nvidia.com/gpu: "1"
            {{- end }}
{{- $merged := merge $.Values.global.resources $svc.resources }}
{{ toYaml $merged | indent 12 }}
---
{{- end }}
{{- end }}
