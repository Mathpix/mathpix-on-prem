{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
  namespace: {{ include "mathpix-ocr.fullname" $ }}-mathpix-ocr
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
  template:
    metadata:
      labels:
        app: {{ include "mathpix-ocr.fullname" $ }}-{{ $name | lower }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mathpix-ocr.fullname" $ }}-postgres 5432; do
                echo "waiting for postgres"
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mathpix-ocr.fullname" $ }}-redis 6379; do
                echo "waiting for redis"
                sleep 2
              done
      containers:
        - name: {{ $name | lower }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.service.port }}
          {{- with $svc.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
{{ toYaml . | indent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mathpix-ocr.fullname" $ }}-mathpix-env
          {{- if gt (len $svc.env) 0 }}
          env:
{{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
{{- end }}
          {{- end }}
          resources:
            {{- if eq $name "ocr-worker" }}
            limits:
              nvidia.com/gpu: "1"
            {{- end }}
{{- $merged := merge $.Values.global.resources $svc.resources }}
{{ toYaml $merged | indent 12 }}
---
{{- end }}
{{- end }}
